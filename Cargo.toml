[package]
name = "sunbeam-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
dirs = "5"
arboard = "3"
reqwest = { version = "0.12", features = ["blocking"] }
sha1 = "0.10"
hex = "0.4"
open = "5"
chrono = "0.4"
jsonschema = "0.18"
textwrap = "0.16"
regex = "1"
once_cell = "1"
url = "2"
strip-ansi-escapes = "0.2"
atty = "0.2"
tempfile = "3"
pulldown-cmark = "0.11"
clap_complete = "4"
